name: Weekly Knowledge Base Update

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # fail fast and visibly, not silently for 6h (GitHub's hard ceiling)
    # Two runs at once (e.g. a manual run during the scheduled one) would both
    # embed everything and race to push; queue instead of cancelling.
    concurrency:
      group: weekly-kb-update
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The three update steps use continue-on-error so one failing doesn't
      # skip the others or the commit of whatever did succeed; the final
      # step turns any failure back into a red run. Without that, an
      # exhausted OpenAI balance (HTTP 429 insufficient_quota) was logged and
      # swallowed, and every run stayed green for ~7 weeks while committing
      # nothing.
      - name: Run knowledge base update (Reddit + web + RSS)
        id: kb_update
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python update_knowledge.py

      - name: Run autonomous URL discovery crawler
        id: crawler
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m crawler.crawler

      - name: Ingest newly discovered URLs
        id: ingest_discovered
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'EOF'
          import asyncio
          import aiohttp
          from ingest import ContentProcessor
          from update_knowledge import append_to_vector_store

          async def ingest_discovered():
              try:
                  with open("relevant_urls.txt") as f:
                      urls = [u.strip() for u in f if u.strip()]
              except FileNotFoundError:
                  print("No relevant_urls.txt found — skipping discovered URL ingestion")
                  return

              processor = ContentProcessor()
              docs = []
              # Process the last 50 discovered URLs to avoid runaway ingestion
              async with aiohttp.ClientSession():
                  for url in urls[-50:]:
                      doc = await processor.process_website(url)
                      if doc and processor.validate_content(doc):
                          doc.page_content = processor.preprocess_text(doc.page_content)
                          docs.append(doc)

              if not docs:
                  print("No new discovered content to ingest")
                  return

              chunks = []
              for doc in docs:
                  chunks.extend(processor.text_splitter.split_documents([doc]))

              if append_to_vector_store(chunks):
                  print(f"Ingested {len(chunks)} chunks from discovered URLs")
              else:
                  raise SystemExit("Failed to append discovered URLs to the vector store")

          asyncio.run(ingest_discovered())
          EOF

      - name: Commit updated FAISS index
        # A script, not inline: it re-applies the new index on top of the
        # latest main and retries, because main often moves during this
        # 15+ minute run (see the script's header).
        run: bash .github/scripts/commit_index.sh main

      - name: Fail the run if any update step failed
        if: steps.kb_update.outcome == 'failure' || steps.crawler.outcome == 'failure' || steps.ingest_discovered.outcome == 'failure'
        run: |
          echo "::error::Knowledge base update did not complete cleanly (kb_update=${{ steps.kb_update.outcome }}, crawler=${{ steps.crawler.outcome }}, ingest=${{ steps.ingest_discovered.outcome }}). Most common cause: OpenAI credits exhausted (HTTP 429 insufficient_quota) - check the step logs."
          exit 1
